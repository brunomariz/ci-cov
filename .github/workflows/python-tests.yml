# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python tests

on: [push, pull_request]

permissions:
  contents: read


env:
  PYTHONPATH: .

concurrency:
  # Cancel running jobs if new commits are pushed
  group: >
    ${{ github.workflow }}-
    ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

runs-on: ubuntu-latest

jobs:


  fast-tests:
    name: Fast Tests
    # Runs on all pushes and pull requests for quick feedback

    steps:

    - name: Pre-run cleanup
        # Make sure the current directory is empty
      run: find . -delete

    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update \
        && sudo apt-get -y install git python3 \
        && pip3 install pytest pytest-cov

    - name: Running serial fast tests
      run: |
        pytest -m "not slow" --cov=src --cov-report=xml
        cat coverage.xml | grep 'package name="."'

    - name: Post-run cleanup
      if: always()
      run: find . -delete

  slow-tests:
    name: Slow Tests and Parallel Tests
    needs: fast-tests
    if: github.event_name == 'pull_request'
    # Only runs on PRs after fast tests pass - saves resources

    steps:

    - name: Pre-run cleanup
        # Make sure the current directory is empty
      run: find . -delete

    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update \
        && sudo apt-get -y install python3 \
        && pip3 install pytest pytest-cov

    - name: Running serial slow tests
      run: |
        pytest -m "slow" --cov=src --cov-report=xml

    - name: Uploading coverage to Codecov
      run: |
        echo "Upload"
        cat cat coverage.xml | grep 'package name="."'

    - name: Post-run cleanup
      if: always()
      run: find . -delete