# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python tests

on: [push, pull_request]

permissions:
  contents: read


env:
  PYTHONPATH: .

concurrency:
  # Cancel running jobs if new commits are pushed
  group: >
    ${{ github.workflow }}-
    ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    name: Fast Tests
    # Runs on all pushes and pull requests for quick feedback

    steps:

    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update \
        && sudo apt-get -y install git python3 \
        && pip3 install pytest pytest-cov

    - name: Running serial fast tests
      run: |
        pytest -m "not slow" --cov=src
        # cat coverage.xml | grep 'package name="."'

    - name: Debug coverage file
      run: ls -la

    - name: Upload coverage data
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: |
          .coverage

  slow-tests:
    runs-on: ubuntu-latest
    name: Slow Tests and Parallel Tests
    needs: fast-tests
    if: github.event_name == 'pull_request'
    # Only runs on PRs after fast tests pass - saves resources

    steps:

    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update \
        && sudo apt-get -y install python3 \
        && pip3 install pytest pytest-cov

    - name: Running serial slow tests before downloading coverage
      run: |
        pytest -m "slow" --cov=src --cov-report=xml
        cat coverage.xml | grep "package name="


    - name: Download coverage data
      uses: actions/download-artifact@v4
      with:
        name: coverage
  
    - name: Running serial slow tests after downloading coverage with cov-append enabled
      run: |
        pytest -m "slow" --cov=src --cov-report=xml --cov-append 
        cat coverage.xml | grep "package name="

    - name: Uploading coverage to Codecov
      run: |
        echo "Upload"
        cat coverage.xml | grep "package name="
